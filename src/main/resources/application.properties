spring.application.name=bookingclinic
# Thông tin kết nối SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Booking-clinic-system;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình Hibernate (Tự động cập nhật bảng)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Đường dẫn thư mục lưu trữ (Có thể đổi tùy ý)
file.upload-dir=uploads
# Giới hạn dung lượng file nếu cần
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB